# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build GramSrv
on: [push, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod требует go 1.25.0 (и зависимости td/pgx/minio/jwx тоже
          # объявляют go 1.24–1.25), поэтому тулчейн 1.22 падал на
          # "go.mod requires go >= 1.25.0 (running go 1.22.x)".
          go-version: '1.25'

          cache: false 

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Устанавливаем библиотеки для PostgreSQL и инструменты сборки C
          sudo apt-get install -y libpq-dev build-essential

      - name: Build Server

        run: |
          go mod download
          CGO_ENABLED=1 go build -v -ldflags="-s -w" -o gramsrv ./cmd/telesrv

      - name: Build Admin
        run: |
          CGO_ENABLED=1 go build -v -ldflags="-s -w" -o gramsrv-admin ./cmd/telesrv-admin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gramsrv-binaries
          path: |
            gramsrv
            gramsrv-admin
          retention-days: 1
