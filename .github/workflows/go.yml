# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build GramSrv
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' 

      - name: Build Server
        run: |
          go mod download
          # Собираем основной сервер с оптимизацией размера
          go build -v -ldflags="-s -w" -o gramsrv ./cmd/telesrv

      - name: Build Admin
        run: |
          # Собираем админку
          go build -v -ldflags="-s -w" -o gramsrv-admin ./cmd/gramsrv-admin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gramsrv-binaries
          path: |
            gramsrv
            gramsrv-admin
